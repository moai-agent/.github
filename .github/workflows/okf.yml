name: okf

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/okf.yml'
  # The `okf` job is a required branch-protection check, so it must run for
  # every pull request. A path filter would leave unrelated PRs permanently
  # blocked when GitHub skips the required check.
  pull_request:

permissions:
  contents: read

concurrency:
  group: okf-${{ github.ref }}
  cancel-in-progress: true

env:
  OKF_VERSION: v0.5.0

jobs:
  okf:
    name: okf
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install okf
        run: |
          set -euo pipefail
          go install "github.com/okfcli/okf/cmd/okf@${OKF_VERSION}"

      - name: Assert pinned okf version
        run: |
          set -euo pipefail
          got=$(go version -m "$(command -v okf)" | awk '$1=="mod"{print $3; exit}')
          if [ "$got" != "${OKF_VERSION}" ]; then
            echo "::error::okf version drift: installed $got, pinned ${OKF_VERSION}"
            exit 1
          fi
          echo "okf ${got}"

      - name: Validate OKF documentation
        run: |
          set -euo pipefail
          okf validate docs | jq .
